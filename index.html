<!doctype html>
<html lang="en">
  <head>
    <!-- Runs before first paint so there's no flash of the wrong theme: reads
         the saved preference, defaulting to light when none is saved yet
         (ignores OS preference), applies the `dark` class synchronously (the
         same class ThemeToggle manages later), and sets the mobile
         browser-chrome color to match. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var dark = stored === 'dark'
          if (dark) document.documentElement.classList.add('dark')
          document.addEventListener('DOMContentLoaded', function () {
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', dark ? '#15130F' : '#F7F4EC')
          })
        } catch (e) {}
      })()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#15130F" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,450;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Collins Rotich — Loyalty strategy, campaign management, and customer data analytics across East Africa."
    />
    <title>Collins Rotich</title>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://crotich.com/" />
    <meta property="og:title" content="Collins Rotich" />
    <meta
      property="og:description"
      content="Loyalty strategy, campaign management, and customer data analytics across East Africa."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Collins Rotich" />
    <meta
      name="twitter:description"
      content="Loyalty strategy, campaign management, and customer data analytics across East Africa."
    />
  </head>
  <body class="bg-canvas text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
